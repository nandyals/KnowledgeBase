<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0e0f11;
  --bg2: #141518;
  --bg3: #1a1c20;
  --bg4: #21242a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --text2: #9095a3;
  --text3: #5a5f6e;
  --accent: #6c63ff;
  --accent-dim: rgba(108,99,255,0.15);
  --accent-text: #a59fff;
  --font: 'Syne', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --radius: 10px;
  --radius-lg: 14px;
  --sidebar: 220px;
  --topbar: 56px;

  --c-bug: #ff6b6b; --c-bug-bg: rgba(255,107,107,0.1);
  --c-config: #43e97b; --c-config-bg: rgba(67,233,123,0.1);
  --c-network: #f9a825; --c-network-bg: rgba(249,168,37,0.1);
  --c-auth: #f06292; --c-auth-bg: rgba(240,98,146,0.1);
  --c-infra: #9c8fff; --c-infra-bg: rgba(156,143,255,0.1);
  --c-perf: #26c6da; --c-perf-bg: rgba(38,198,218,0.1);
  --c-db: #ff8c42; --c-db-bg: rgba(255,140,66,0.1);
  --c-hyper: #4fc3f7; --c-hyper-bg: rgba(79,195,247,0.1);
  --c-k8s: #7ecfff; --c-k8s-bg: rgba(126,207,255,0.1);
  --c-process: #aed581; --c-process-bg: rgba(174,213,129,0.1);
  --c-rhosp: #ce93d8; --c-rhosp-bg: rgba(206,147,216,0.1);
  --c-auto: #80cbc4; --c-auto-bg: rgba(128,203,196,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* SIDEBAR */
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-logo-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-dim);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-icon i{font-size:14px;color:var(--accent-text)}
.sb-logo-text{font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--text);line-height:1.1}
.sb-logo-sub{font-size:10px;color:var(--text3);font-family:var(--mono)}
.sb-nav{padding:8px 0}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:all .15s;position:relative;border-radius:0;user-select:none}
.sb-item:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.sb-item.active{color:var(--text);background:rgba(108,99,255,0.1)}
.sb-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sb-item i{font-size:13px;width:15px;text-align:center}
.sb-count{margin-left:auto;font-size:10px;background:var(--bg4);color:var(--text3);padding:1px 6px;border-radius:20px;font-family:var(--mono)}
.sb-section{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:12px 16px 5px;font-family:var(--mono)}
.sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-add-cat{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;color:var(--text3);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font);transition:color .15s}
.sb-add-cat:hover{color:var(--accent-text)}
.sb-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);font-family:var(--mono)}

/* TOPBAR */
.topbar{height:var(--topbar);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0;background:var(--bg2)}
.topbar-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.topbar-title .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.search-wrap{flex:1;max-width:340px;position:relative;margin-left:auto}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3)}
#search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px 7px 32px;color:var(--text);font-size:12.5px;font-family:var(--font);outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--text3)}
.btn-add{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:12.5px;font-family:var(--font);font-weight:600;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.btn-add:hover{opacity:.85}

/* STATS BAR */
.stats-bar{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);overflow-x:auto}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;min-width:80px;flex-shrink:0}
.stat-num{font-size:20px;font-weight:700;line-height:1;font-family:var(--mono)}
.stat-label{font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap}

/* FILTER ROW */
.filter-row{display:flex;align-items:center;gap:7px;padding:10px 20px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;background:var(--bg)}
.fpill{padding:4px 12px;border-radius:20px;border:1px solid var(--border2);font-size:11.5px;color:var(--text2);background:transparent;cursor:pointer;font-family:var(--font);transition:all .15s}
.fpill:hover{border-color:var(--accent);color:var(--accent-text)}
.fpill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-text)}
.sort-select{margin-left:auto;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:11.5px;padding:4px 8px;font-family:var(--font);outline:none;cursor:pointer}
.sort-select:focus{border-color:var(--accent)}

/* ENTRIES */
.entries-wrap{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.entry-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color .15s}
.entry-card:hover{border-color:var(--border2)}
.entry-card.expanded{border-color:var(--border2)}
.entry-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}
.entry-title{font-size:13px;font-weight:600;line-height:1.4;flex:1;color:var(--text)}
.entry-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.badge-sev-high{background:rgba(255,107,107,0.15);color:#ff6b6b}
.badge-sev-medium{background:rgba(249,168,37,0.15);color:#f9a825}
.badge-sev-low{background:rgba(67,233,123,0.12);color:#43e97b}
.badge-open{background:rgba(249,168,37,0.12);color:#f9a825}
.badge-resolved{background:rgba(67,233,123,0.12);color:#43e97b}
.badge-recur{background:rgba(108,99,255,0.15);color:var(--accent-text)}
.entry-date{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap;font-family:var(--mono);padding-top:2px}
.chevron{font-size:12px;color:var(--text3);transition:transform .2s;margin-top:2px;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.entry-body{border-top:1px solid var(--border);padding:12px 14px;display:none;font-size:12.5px;color:var(--text2);line-height:1.7}
.entry-body.show{display:block}
.eb-section{margin-bottom:10px}
.eb-section:last-child{margin-bottom:0}
.eb-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin-bottom:4px}
.eb-text{font-size:12.5px;color:var(--text2);line-height:1.65}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-family:var(--mono);font-size:11.5px;color:#a8d8a8;white-space:pre-wrap;word-break:break-all;margin-top:2px}
.recur-banner{background:var(--accent-dim);border:1px solid rgba(108,99,255,0.25);border-radius:var(--radius);padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--accent-text);margin-bottom:10px}
.entry-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.act-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-size:11.5px;cursor:pointer;font-family:var(--font);transition:all .15s}
.act-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.act-btn.del:hover{background:rgba(255,107,107,0.1);color:#ff6b6b;border-color:rgba(255,107,107,0.3)}

/* RECURRING VIEW */
.recur-view{flex:1;overflow-y:auto;padding:14px 20px}
.recur-view h2{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--text)}
.recur-list{display:flex;flex-direction:column;gap:8px}
.recur-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.recur-row:hover{border-color:var(--border2)}
.recur-info{flex:1;min-width:0}
.recur-title{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recur-meta{display:flex;gap:6px;align-items:center}
.recur-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.recur-count{font-size:12px;color:var(--accent-text);font-weight:700;font-family:var(--mono)}
.recur-bar-wrap{width:64px;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden}
.recur-bar-fill{height:100%;border-radius:2px;background:var(--accent)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:32px;display:block;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:560px;max-width:100%;max-height:90vh;overflow-y:auto;padding:22px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-header h2 i{color:var(--accent-text)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 11px;color:var(--text);font-size:12.5px;font-family:var(--font);outline:none;transition:border-color .15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent)}
.form-row textarea{resize:vertical;min-height:72px;line-height:1.55}
.form-row input::placeholder,.form-row textarea::placeholder{color:var(--text3)}
.form-row select option{background:var(--bg3)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.code-input{font-family:var(--mono);font-size:11.5px}
.recur-toggle-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
.toggle-label{font-size:12px;color:var(--text2);flex:1}
.toggle-switch{position:relative;width:34px;height:18px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg4);border-radius:20px;cursor:pointer;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;width:12px;height:12px;left:3px;top:3px;background:var(--text3);border-radius:50%;transition:all .2s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(16px);background:#fff}
.recur-count-input{margin-top:8px;display:none}
.recur-count-input.show{display:block}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.btn-cancel{padding:7px 16px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-size:12.5px;font-family:var(--font);cursor:pointer;transition:all .15s}
.btn-cancel:hover{background:var(--bg3);color:var(--text)}
.btn-save{padding:7px 20px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:12.5px;font-family:var(--font);font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}

/* CAT MODAL */
.cat-color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:5px}
.cat-color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cat-color-opt.selected{border-color:var(--text);transform:scale(1.15)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:12.5px;color:var(--text);z-index:999;display:flex;align-items:center;gap:8px;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast i{color:var(--accent-text)}

/* COPY CONFIRM */
.copied{color:#43e97b !important}

/* RESPONSIVE */
@media(max-width:640px){
  .sidebar{display:none}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon"><i class="fa-solid fa-book-open"></i></div>
      <div>
        <div class="sb-logo-text">IT Knowledge Base</div>
        <div class="sb-logo-sub">v1.0 · localStorage</div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-item active" data-view="all" onclick="setView('all',this)">
        <i class="fa-solid fa-table-cells-large"></i> All entries
        <span class="sb-count" id="count-all">0</span>
      </div>
      <div class="sb-item" data-view="recurring" onclick="setView('recurring',this)">
        <i class="fa-solid fa-fire" style="color:#ff6b6b"></i> Recurring issues
        <span class="sb-count" id="count-recur">0</span>
      </div>
      <div class="sb-item" data-view="recent" onclick="setView('recent',this)">
        <i class="fa-regular fa-clock"></i> Recent (7 days)
        <span class="sb-count" id="count-recent">0</span>
      </div>
      <div class="sb-section">Categories</div>
      <div id="cat-nav"></div>
      <button class="sb-add-cat" onclick="openCatModal()">
        <i class="fa-solid fa-plus" style="font-size:11px"></i> Add category
      </button>
    </nav>
    <div class="sb-footer">entries stored locally</div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="view-title">
        <span class="cat-dot" id="view-dot" style="display:none"></span>
        All entries
      </div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="Search titles, causes, fixes, commands…" oninput="render()">
      </div>
      <button class="btn-add" onclick="openEntryModal()">
        <i class="fa-solid fa-plus"></i> Add entry
      </button>
    </div>

    <!-- ALL / FILTER VIEW -->
    <div id="main-list-view">
      <div class="stats-bar" id="stats-bar"></div>
      <div class="filter-row" id="filter-row">
        <button class="fpill active" data-sf="all" onclick="setSeverityFilter('all',this)">All</button>
        <button class="fpill" data-sf="High" onclick="setSeverityFilter('High',this)">High</button>
        <button class="fpill" data-sf="Medium" onclick="setSeverityFilter('Medium',this)">Medium</button>
        <button class="fpill" data-sf="Low" onclick="setSeverityFilter('Low',this)">Low</button>
        <button class="fpill" data-sf="Open" onclick="setSeverityFilter('Open',this)">Open</button>
        <button class="fpill" data-sf="Resolved" onclick="setSeverityFilter('Resolved',this)">Resolved</button>
        <button class="fpill" data-sf="Recurring" onclick="setSeverityFilter('Recurring',this)">Recurring</button>
        <select class="sort-select" id="sortBy" onchange="render()">
          <option value="date">Newest first</option>
          <option value="sev">Severity</option>
          <option value="recur">Most recurring</option>
          <option value="title">A → Z</option>
        </select>
      </div>
      <div class="entries-wrap" id="entries"></div>
    </div>

    <!-- RECURRING VIEW -->
    <div id="main-recur-view" style="display:none">
      <div class="recur-view" id="recur-list-wrap"></div>
    </div>
  </div>
</div>

<!-- ENTRY MODAL -->
<div class="overlay" id="entryModal">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fa-solid fa-circle-plus"></i> <span id="modal-title-text">Add new entry</span></h2>
      <button class="modal-close" onclick="closeEntryModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-row">
      <label>Title / issue summary</label>
      <input type="text" id="f-title" placeholder="e.g. Postgres replication lag spikes during backup window">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Category</label>
        <select id="f-cat"></select>
      </div>
      <div class="form-row">
        <label>Severity</label>
        <select id="f-sev">
          <option>High</option><option selected>Medium</option><option>Low</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Status</label>
        <select id="f-status"><option>Open</option><option selected>Resolved</option></select>
      </div>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="form-row">
      <label>Root cause</label>
      <textarea id="f-cause" placeholder="What caused the issue?"></textarea>
    </div>
    <div class="form-row">
      <label>Steps to fix / resolution</label>
      <textarea id="f-fix" placeholder="Step-by-step fix or workaround…" style="min-height:90px"></textarea>
    </div>
    <div class="form-row">
      <label>Commands / code snippets</label>
      <textarea id="f-code" class="code-input" placeholder="Relevant commands or config…"></textarea>
    </div>
    <div class="form-row">
      <label>Notes & context</label>
      <textarea id="f-notes" placeholder="Edge cases, links, related tickets, what to watch for…"></textarea>
    </div>
    <div class="form-row">
      <label>Recurring issue</label>
      <div class="recur-toggle-row">
        <span class="toggle-label">Mark as recurring — track how often this comes up</span>
        <label class="toggle-switch">
          <input type="checkbox" id="f-recur" onchange="toggleRecurCount()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="recur-count-input" id="recur-count-wrap">
        <div class="form-row" style="margin-top:8px;margin-bottom:0">
          <label>Times reported</label>
          <input type="number" id="f-recur-count" min="1" value="2" style="width:120px">
        </div>
        <div class="form-row" style="margin-top:8px;margin-bottom:0">
          <label>Pattern notes</label>
          <textarea id="f-pattern" placeholder="When does it typically occur? Any triggers or patterns?"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEntryModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save entry</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div class="overlay" id="catModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <h2><i class="fa-solid fa-tag"></i> Add new category</h2>
      <button class="modal-close" onclick="closeCatModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-row">
      <label>Category name</label>
      <input type="text" id="f-cat-name" placeholder="e.g. Security, Monitoring, Storage…">
    </div>
    <div class="form-row">
      <label>Color</label>
      <div class="cat-color-grid" id="color-grid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCatModal()">Cancel</button>
      <button class="btn-save" onclick="saveCat()">Add category</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-check-circle"></i> <span id="toast-msg">Saved</span></div>

<script>
const STORAGE_KEY = 'kb_entries_v2';
const CATS_KEY = 'kb_categories_v2';

const BUILTIN_CATS = [
  {id:'Bug/Error',   label:'Bug / error',   color:'#ff6b6b'},
  {id:'Config',      label:'Config',         color:'#43e97b'},
  {id:'Network',     label:'Network',        color:'#f9a825'},
  {id:'Auth',        label:'Auth',           color:'#f06292'},
  {id:'Infra',       label:'Infra',          color:'#9c8fff'},
  {id:'Performance', label:'Performance',    color:'#26c6da'},
  {id:'Database',    label:'Database',       color:'#ff8c42'},
  {id:'Hyperscalers',label:'Hyperscalers',   color:'#4fc3f7'},
  {id:'Kubernetes',  label:'Kubernetes',     color:'#7ecfff'},
  {id:'Process',     label:'Process',        color:'#aed581'},
  {id:'RHOSP',       label:'RHOSP',          color:'#ce93d8'},
  {id:'Automations', label:'Automations',    color:'#80cbc4'},
];

const COLOR_OPTS = [
  '#ff6b6b','#ff8c42','#f9a825','#43e97b','#26c6da','#4fc3f7',
  '#7ecfff','#80cbc4','#aed581','#a59fff','#ce93d8','#f06292',
  '#ff9de2','#ffcc80','#e0e0e0','#b0bec5'
];

const SEV_ORDER = {High:0,Medium:1,Low:2};

let entries = [];
let customCats = [];
let currentView = 'all';
let currentCatFilter = 'all';
let severityFilter = 'all';
let editId = null;
let selectedColor = COLOR_OPTS[0];

function allCats(){return [...BUILTIN_CATS,...customCats];}
function catById(id){return allCats().find(c=>c.id===id)||{id,label:id,color:'#888'};}

function load(){
  try{entries=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch{entries=[];}
  try{customCats=JSON.parse(localStorage.getItem(CATS_KEY)||'[]');}catch{customCats=[];}
  if(!entries.length) seedData();
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));localStorage.setItem(CATS_KEY,JSON.stringify(customCats));}

function seedData(){
  entries=[
    {id:1,title:'Node process exits with EACCES on port 80',cat:'Bug/Error',sev:'High',status:'Resolved',cause:'Non-root process cannot bind to ports below 1024 on Linux.',fix:'1. Use port 3000+ and reverse-proxy via nginx\n2. Or grant capability: sudo setcap cap_net_bind_service=+ep $(which node)',code:'sudo setcap cap_net_bind_service=+ep /usr/bin/node',notes:'Common on fresh Ubuntu 22 deployments. Check nginx config before escalating.',recurring:false,recurCount:1,pattern:'',date:'2025-05-18',expanded:false},
    {id:2,title:'SSL cert renewal failing — Let\'s Encrypt ACME challenge',cat:'Config',sev:'High',status:'Resolved',cause:'Port 80 blocked by firewall during HTTP-01 challenge.',fix:'1. Temporarily open port 80 in security group\n2. Run: certbot renew --dry-run\n3. Close port 80 after renewal\n4. Consider switching to DNS-01 challenge for internal services',code:'certbot renew --dry-run\ncertbot renew --force-renewal',notes:'Set cron reminder 30 days before expiry. Alert fires at cert age > 60 days.',recurring:true,recurCount:5,pattern:'Happens every 90 days if automation fails. Check cron job health first.',date:'2025-05-15',expanded:false},
    {id:3,title:'DB connection pool exhausted under load',cat:'Database',sev:'High',status:'Open',cause:'Default pool size (5) too low; long-running queries holding connections.',fix:'1. Increase pool max to 20 in config\n2. Add query timeout of 30s\n3. Identify slow queries via EXPLAIN ANALYZE',code:'pool: { max: 20, idleTimeoutMillis: 30000, connectionTimeoutMillis: 2000 }',notes:'Alert fires at 80% pool usage. Run pg_stat_activity to see live connections.',recurring:true,recurCount:4,pattern:'Peaks during business hours and backup windows.',date:'2025-05-20',expanded:false},
    {id:4,title:'CoreDNS pods CPU-throttled in Kubernetes cluster',cat:'Kubernetes',sev:'High',status:'Open',cause:'CoreDNS CPU limit too low (100m); ndots:5 default causing excessive lookup chains.',fix:'1. Raise CoreDNS CPU limit to 200m in configmap\n2. Add dnsConfig ndots:2 in pod spec\n3. Use FQDN in service-to-service calls',code:'kubectl edit cm coredns -n kube-system\n---\ndnsConfig:\n  options:\n    - name: ndots\n      value: "2"',notes:'Affects clusters >200 pods. ndots:5 triggers 5 extra searches per hostname lookup.',recurring:true,recurCount:8,pattern:'Spikes when new deployments roll out and DNS lookups increase.',date:'2025-05-22',expanded:false},
    {id:5,title:'RHOSP instance stuck in "deleting" state',cat:'RHOSP',sev:'Medium',status:'Resolved',cause:'Nova compute service lost connection to hypervisor mid-delete; state machine stuck.',fix:'1. Check nova-compute logs on the hypervisor\n2. Force-delete via: openstack server delete --force <id>\n3. Clean orphaned volumes in Cinder',code:'openstack server delete --force <instance-id>\nopenstack volume list --status error',notes:'Run nova-manage db archive_deleted_rows periodically to clean stale records.',recurring:false,recurCount:1,pattern:'',date:'2025-05-18',expanded:false},
    {id:6,title:'Ansible playbook fails on sudo privilege escalation',cat:'Automations',sev:'Low',status:'Resolved',cause:'Remote user missing from sudoers; become_user not matching service account.',fix:'1. Add user to /etc/sudoers.d/ on target hosts\n2. Set become: yes and become_user in playbook task\n3. Re-run with -vvv for verbose privilege debug',code:'ansible-playbook site.yml -i inventory --become -vvv',notes:'Affects first-run on newly provisioned hosts. Add to onboarding checklist.',recurring:false,recurCount:1,pattern:'',date:'2025-05-15',expanded:false},
    {id:7,title:'AWS EC2 instance unreachable after security group change',cat:'Hyperscalers',sev:'High',status:'Resolved',cause:'Port 22 accidentally removed from inbound rules of attached security group.',fix:'1. Use EC2 Instance Connect or Session Manager to regain access\n2. Restore port 22 inbound rule via console\n3. Use Terraform / IaC to prevent manual drift',code:'aws ec2 describe-instances --instance-id i-xxxx\naws ssm start-session --target i-xxxx',notes:'Enable VPC Flow Logs to audit security group changes. Use SCPs to restrict direct SG edits.',recurring:false,recurCount:1,pattern:'',date:'2025-05-10',expanded:false},
    {id:8,title:'Postgres WAL archive filling disk — replication lag spike',cat:'Database',sev:'High',status:'Resolved',cause:'Replica fell behind; WAL files accumulating faster than archive_cleanup_command runs.',fix:'1. Check pg_replication_slots for inactive slots\n2. Drop stale slots: SELECT pg_drop_replication_slot(slot_name)\n3. Monitor disk with pg_stat_bgwriter',code:"SELECT slot_name, active, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) AS lag FROM pg_replication_slots;",notes:'Set wal_keep_size to a safe minimum. Add disk alert at 75% capacity.',recurring:true,recurCount:3,pattern:'Correlates with backup windows and high write load.',date:'2025-05-08',expanded:false},
    {id:9,title:'Kubernetes pod CrashLoopBackOff — OOM kill',cat:'Kubernetes',sev:'Medium',status:'Resolved',cause:'Memory limit too low; app heap growing beyond 256 MB under normal traffic.',fix:'1. Check: kubectl describe pod <pod> for OOMKilled exit code\n2. Increase memory limit to 512Mi in deployment spec\n3. Profile with heapdump if growth persists',code:'kubectl describe pod <pod-name> -n <namespace>\nkubectl top pod --containers',notes:'Add HPA based on memory utilisation. Set requests = 70% of limits.',recurring:true,recurCount:3,pattern:'Triggered by traffic spikes or memory leak in certain request paths.',date:'2025-05-05',expanded:false},
    {id:10,title:'Process runbook gaps causing repeat escalations',cat:'Process',sev:'Low',status:'Open',cause:'On-call team lacking documented resolution steps for common alerts; escalating unnecessarily.',fix:'1. Identify top 10 recurring alerts by frequency\n2. Write runbook entry per alert with clear resolution steps\n3. Link runbook from PagerDuty alert body',code:'',notes:'Schedule monthly runbook review. Use this KB as primary runbook source.',recurring:false,recurCount:1,pattern:'',date:'2025-05-01',expanded:false},
  ];
  save();
}

function setView(view, el){
  currentView=view;
  currentCatFilter='all';
  severityFilter='all';
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('main-list-view').style.display = view==='recurring' ? 'none' : 'flex';
  document.getElementById('main-list-view').style.flexDirection = 'column';
  document.getElementById('main-recur-view').style.display = view==='recurring' ? 'block' : 'none';
  document.getElementById('view-dot').style.display='none';
  if(view==='recurring'){
    document.getElementById('view-title').innerHTML='<i class="fa-solid fa-fire" style="color:#ff6b6b;font-size:14px"></i>&nbsp; Recurring issues';
    renderRecurring();
  } else if(view==='recent'){
    document.getElementById('view-title').textContent='Recent (last 7 days)';
    render();
  } else if(view==='all'){
    document.getElementById('view-title').textContent='All entries';
    render();
  } else {
    const cat=catById(view);
    document.getElementById('view-dot').style.cssText=`display:inline-block;width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0`;
    document.getElementById('view-title').innerHTML=`<span class="cat-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0;margin-right:6px"></span>${cat.label}`;
    currentCatFilter=view;
    render();
  }
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  document.querySelector('.fpill[data-sf="all"]').classList.add('active');
  severityFilter='all';
}

function setSeverityFilter(val,el){
  severityFilter=val;
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const sort=document.getElementById('sortBy').value;
  let list=[...entries];
  if(currentView==='recent'){const now=new Date();list=list.filter(e=>(now-new Date(e.date))/(86400000)<=7);}
  if(currentCatFilter!=='all') list=list.filter(e=>e.cat===currentCatFilter);
  if(severityFilter==='Open'||severityFilter==='Resolved') list=list.filter(e=>e.status===severityFilter);
  else if(severityFilter==='Recurring') list=list.filter(e=>e.recurring);
  else if(severityFilter!=='all') list=list.filter(e=>e.sev===severityFilter);
  if(q) list=list.filter(e=>[e.title,e.cat,e.cause,e.fix,e.notes,e.code,e.pattern].join(' ').toLowerCase().includes(q));
  if(sort==='date') list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(sort==='sev') list.sort((a,b)=>SEV_ORDER[a.sev]-SEV_ORDER[b.sev]);
  else if(sort==='recur') list.sort((a,b)=>(b.recurCount||1)-(a.recurCount||1));
  else list.sort((a,b)=>a.title.localeCompare(b.title));
  return list;
}

function render(){
  const list=getFiltered();
  renderStats();
  renderSidebar();
  const container=document.getElementById('entries');
  if(!list.length){container.innerHTML='<div class="empty"><i class="fa-regular fa-face-meh"></i><p>No entries match your search or filter.</p></div>';return;}
  container.innerHTML=list.map(e=>entryHTML(e)).join('');
}

function entryHTML(e){
  const cat=catById(e.cat);
  const catBadge=`<span class="badge" style="background:${hexAlpha(cat.color,.13)};color:${cat.color}">${cat.label}</span>`;
  const sevBadge=`<span class="badge badge-sev-${e.sev.toLowerCase()}">${e.sev}</span>`;
  const statusBadge=`<span class="badge badge-${e.status.toLowerCase()}">${e.status}</span>`;
  const recurBadge=e.recurring?`<span class="badge badge-recur"><i class="fa-solid fa-rotate" style="font-size:9px"></i> ${e.recurCount}×</span>`:'';
  const dateStr=fmtDate(e.date);
  const body=e.expanded?`
    <div class="entry-body show">
      ${e.recurring&&e.pattern?`<div class="recur-banner"><i class="fa-solid fa-rotate"></i> Reported ${e.recurCount}× — ${e.pattern}</div>`:''}
      ${e.cause?`<div class="eb-section"><div class="eb-label">Root cause</div><div class="eb-text">${esc(e.cause)}</div></div>`:''}
      ${e.fix?`<div class="eb-section"><div class="eb-label">Resolution / steps</div><div class="eb-text">${esc(e.fix)}</div></div>`:''}
      ${e.code?`<div class="eb-section"><div class="eb-label">Commands / snippet</div><div class="code-block">${esc(e.code)}</div></div>`:''}
      ${e.notes?`<div class="eb-section"><div class="eb-label">Notes & context</div><div class="eb-text">${esc(e.notes)}</div></div>`:''}
      <div class="entry-actions">
        <button class="act-btn" onclick="editEntry(${e.id});event.stopPropagation()"><i class="fa-regular fa-pen-to-square"></i> Edit</button>
        <button class="act-btn" id="copy-btn-${e.id}" onclick="copyFix(${e.id});event.stopPropagation()"><i class="fa-regular fa-copy"></i> Copy fix</button>
        <button class="act-btn del" onclick="deleteEntry(${e.id});event.stopPropagation()"><i class="fa-regular fa-trash-can"></i> Delete</button>
      </div>
    </div>`:`<div class="entry-body"></div>`;
  return `<div class="entry-card${e.expanded?' expanded':''}" id="card-${e.id}">
    <div class="entry-head" onclick="toggle(${e.id})">
      <div style="flex:1;min-width:0">
        <div class="entry-title">${esc(e.title)}</div>
        <div class="entry-meta">${catBadge}${sevBadge}${statusBadge}${recurBadge}<span class="entry-date">${dateStr}</span></div>
      </div>
      <i class="fa-solid fa-chevron-down chevron${e.expanded?' open':''}"></i>
    </div>${body}</div>`;
}

function toggle(id){const e=entries.find(x=>x.id===id);if(e){e.expanded=!e.expanded;}render();}

function renderStats(){
  const total=entries.length;
  const open=entries.filter(e=>e.status==='Open').length;
  const high=entries.filter(e=>e.sev==='High').length;
  const resolved=entries.filter(e=>e.status==='Resolved').length;
  const recur=entries.filter(e=>e.recurring).length;
  const now=new Date();
  const week=entries.filter(e=>(now-new Date(e.date))/86400000<=7).length;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total entries</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#f9a825">${open}</div><div class="stat-label">Open</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#ff6b6b">${high}</div><div class="stat-label">High severity</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#43e97b">${resolved}</div><div class="stat-label">Resolved</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--accent-text)">${recur}</div><div class="stat-label">Recurring</div></div>
    <div class="stat-card"><div class="stat-num">${week}</div><div class="stat-label">This week</div></div>`;
}

function renderSidebar(){
  const cats=allCats();
  document.getElementById('count-all').textContent=entries.length;
  document.getElementById('count-recur').textContent=entries.filter(e=>e.recurring).length;
  const now=new Date();
  document.getElementById('count-recent').textContent=entries.filter(e=>(now-new Date(e.date))/86400000<=7).length;
  const nav=document.getElementById('cat-nav');
  nav.innerHTML=cats.map(c=>{
    const cnt=entries.filter(e=>e.cat===c.id).length;
    const active=currentView===c.id?'active':'';
    return `<div class="sb-item ${active}" onclick="setView('${c.id}',this)">
      <span class="sb-dot" style="background:${c.color}"></span>${c.label}
      <span class="sb-count">${cnt}</span></div>`;
  }).join('');
}

function renderRecurring(){
  renderSidebar();
  const list=entries.filter(e=>e.recurring).sort((a,b)=>(b.recurCount||1)-(a.recurCount||1));
  const max=list.length?Math.max(...list.map(e=>e.recurCount||1)):1;
  const wrap=document.getElementById('recur-list-wrap');
  if(!list.length){wrap.innerHTML='<h2><i class="fa-solid fa-fire" style="color:#ff6b6b"></i> Recurring issues</h2><div class="empty"><i class="fa-regular fa-face-smile"></i><p>No recurring issues marked yet. Edit any entry and toggle "recurring" to track it here.</p></div>';return;}
  wrap.innerHTML=`<h2><i class="fa-solid fa-fire" style="color:#ff6b6b"></i> Recurring issues <span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:4px">sorted by frequency</span></h2>
    <div class="recur-list">${list.map(e=>{
      const cat=catById(e.cat);
      const pct=Math.round(((e.recurCount||1)/max)*100);
      return `<div class="recur-row" onclick="jumpToEntry(${e.id})">
        <div class="recur-info">
          <div class="recur-title">${esc(e.title)}</div>
          <div class="recur-meta">
            <span class="badge" style="background:${hexAlpha(cat.color,.13)};color:${cat.color}">${cat.label}</span>
            <span class="badge badge-sev-${e.sev.toLowerCase()}">${e.sev}</span>
            ${e.pattern?`<span style="font-size:10.5px;color:var(--text3);margin-left:2px">${esc(e.pattern.slice(0,60))}…</span>`:''}
          </div>
        </div>
        <div class="recur-right">
          <div class="recur-count">${e.recurCount}×</div>
          <div class="recur-bar-wrap"><div class="recur-bar-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    }).join('')}</div>`;
}

function jumpToEntry(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  e.expanded=true;
  setView('all',document.querySelector('.sb-item[data-view="all"]'));
  setTimeout(()=>{const el=document.getElementById(`card-${id}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100);
}

function openEntryModal(edit){
  editId=edit||null;
  const today=new Date().toISOString().split('T')[0];
  populateCatSelect();
  if(edit){
    const e=entries.find(x=>x.id===edit);
    document.getElementById('modal-title-text').textContent='Edit entry';
    document.getElementById('f-title').value=e.title;
    document.getElementById('f-cat').value=e.cat;
    document.getElementById('f-sev').value=e.sev;
    document.getElementById('f-status').value=e.status;
    document.getElementById('f-date').value=e.date||today;
    document.getElementById('f-cause').value=e.cause||'';
    document.getElementById('f-fix').value=e.fix||'';
    document.getElementById('f-code').value=e.code||'';
    document.getElementById('f-notes').value=e.notes||'';
    document.getElementById('f-recur').checked=e.recurring||false;
    document.getElementById('f-recur-count').value=e.recurCount||2;
    document.getElementById('f-pattern').value=e.pattern||'';
    toggleRecurCount();
  } else {
    document.getElementById('modal-title-text').textContent='Add new entry';
    ['f-title','f-cause','f-fix','f-code','f-notes','f-pattern'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-sev').value='Medium';
    document.getElementById('f-status').value='Resolved';
    document.getElementById('f-date').value=today;
    document.getElementById('f-recur').checked=false;
    document.getElementById('f-recur-count').value=2;
    toggleRecurCount();
  }
  document.getElementById('entryModal').classList.add('open');
  document.getElementById('f-title').focus();
}
function closeEntryModal(){document.getElementById('entryModal').classList.remove('open');}

function populateCatSelect(){
  const sel=document.getElementById('f-cat');
  sel.innerHTML=allCats().map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
}

function toggleRecurCount(){
  const on=document.getElementById('f-recur').checked;
  document.getElementById('recur-count-wrap').className='recur-count-input'+(on?' show':'');
}

function saveEntry(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  const recurring=document.getElementById('f-recur').checked;
  const data={
    title,cat:document.getElementById('f-cat').value,
    sev:document.getElementById('f-sev').value,status:document.getElementById('f-status').value,
    date:document.getElementById('f-date').value,
    cause:document.getElementById('f-cause').value.trim(),
    fix:document.getElementById('f-fix').value.trim(),
    code:document.getElementById('f-code').value.trim(),
    notes:document.getElementById('f-notes').value.trim(),
    recurring,recurCount:recurring?parseInt(document.getElementById('f-recur-count').value)||2:1,
    pattern:recurring?document.getElementById('f-pattern').value.trim():'',
    expanded:false
  };
  if(editId){const i=entries.findIndex(x=>x.id===editId);entries[i]={...entries[i],...data};}
  else{const newId=Date.now();entries.unshift({id:newId,...data});}
  save();closeEntryModal();
  if(currentView==='recurring') renderRecurring(); else render();
  showToast(editId?'Entry updated':'Entry saved');
}

function editEntry(id){openEntryModal(id);}

function deleteEntry(id){
  if(!confirm('Delete this entry? This cannot be undone.')) return;
  entries=entries.filter(x=>x.id!==id);
  save();
  if(currentView==='recurring') renderRecurring(); else render();
  showToast('Entry deleted');
}

function copyFix(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  const text=`Issue: ${e.title}\nCause: ${e.cause}\nFix:\n${e.fix}${e.code?'\n\nCommands:\n'+e.code:''}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  const btn=document.getElementById(`copy-btn-${id}`);
  if(btn){btn.innerHTML='<i class="fa-solid fa-check"></i> Copied';btn.classList.add('copied');setTimeout(()=>{btn.innerHTML='<i class="fa-regular fa-copy"></i> Copy fix';btn.classList.remove('copied');},2000);}
  showToast('Fix copied to clipboard');
}

function openCatModal(){
  selectedColor=COLOR_OPTS[0];
  document.getElementById('f-cat-name').value='';
  const grid=document.getElementById('color-grid');
  grid.innerHTML=COLOR_OPTS.map((c,i)=>`<div class="cat-color-opt${i===0?' selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor(this,'${c}')"></div>`).join('');
  document.getElementById('catModal').classList.add('open');
  setTimeout(()=>document.getElementById('f-cat-name').focus(),100);
}
function closeCatModal(){document.getElementById('catModal').classList.remove('open');}
function selectColor(el,c){selectedColor=c;document.querySelectorAll('.cat-color-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');}
function saveCat(){
  const name=document.getElementById('f-cat-name').value.trim();
  if(!name) return;
  const id=name.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  if(allCats().find(c=>c.id===id)){showToast('Category already exists');return;}
  customCats.push({id,label:name,color:selectedColor});
  save();closeCatModal();renderSidebar();
  showToast('Category added');
}

function showToast(msg,duration=2200){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),duration);
}

function hexAlpha(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(d){if(!d)return '';const[y,m,dy]=d.split('-');const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${months[+m-1]} ${+dy}, ${y}`;}

document.getElementById('entryModal').addEventListener('click',e=>{if(e.target===document.getElementById('entryModal'))closeEntryModal();});
document.getElementById('catModal').addEventListener('click',e=>{if(e.target===document.getElementById('catModal'))closeCatModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEntryModal();closeCatModal();}});

load();
render();
</script>
</body>
</html>
